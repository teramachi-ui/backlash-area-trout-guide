<script>
  (function () {
    if (window.__backlashAreaTroutEmbedReady) return;
    window.__backlashAreaTroutEmbedReady = true;

    var frame = document.getElementById("backlash-area-trout-frame");
    if (!frame) return;

    window.addEventListener("message", function (event) {
      if (event.origin !== "https://backlash-area-trout-guide.vercel.app") return;
      if (!event.data || event.data.type !== "backlash-area-trout-height") return;

      var height = Number(event.data.height);
      if (!Number.isFinite(height) || height < 600 || height > 30000) return;
      frame.style.height = Math.ceil(height) + "px";
    });
  })();
</script>
